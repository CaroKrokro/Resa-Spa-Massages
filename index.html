<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flux Salette</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap">
<style>
/* Layout concept: one shell, four lenses on the same data. Client view is framed as a page of la-salette.fr.
   Brand: sage green from the logo, deep slate from the site hero, Montserrat as on la-salette.fr. */
:root{
  --bg:#EFF1EE; --surface:#FAFBFA; --ink:#1F2A2C; --muted:#5F6C6D; --line:#D6DCDA;
  --accent:#56705B; --accent-ink:#FFFFFF; --accent-soft:#E2EBE0;
  --brand:#243438; --sage:#8EA483;
  --ok:#2B6F5A; --ok-soft:#D8EAE2; --warn:#8F6310; --warn-soft:#F3E4C2; --crit:#A23F2E; --crit-soft:#F2D9D3;
  --display:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sans:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131B1D; --surface:#1B2426; --ink:#E8EEEC; --muted:#9AA8A8; --line:#2E3A3C;
    --accent:#A5BC9B; --accent-ink:#12191A; --accent-soft:#26332B;
    --ok:#6FC2A5; --ok-soft:#1B3A31; --warn:#E0B050; --warn-soft:#3B2F12; --crit:#EE8D7B; --crit-soft:#3E1F19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131B1D; --surface:#1B2426; --ink:#E8EEEC; --muted:#9AA8A8; --line:#2E3A3C;
  --accent:#A5BC9B; --accent-ink:#12191A; --accent-soft:#26332B;
  --ok:#6FC2A5; --ok-soft:#1B3A31; --warn:#E0B050; --warn-soft:#3B2F12; --crit:#EE8D7B; --crit-soft:#3E1F19;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--sans);margin:0;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
h1{font-family:var(--display);font-size:clamp(26px,4.5vw,36px);line-height:1.1;font-weight:500}
h2{font-family:var(--display);font-size:21px;line-height:1.2;font-weight:500}
h3{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h4{font-size:15px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.top .sub{color:var(--muted);margin-top:6px;max-width:58ch}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;background:var(--surface);color:var(--muted)}
.pill.live{color:var(--ok);border-color:var(--ok)} .pill.local{color:var(--warn);border-color:var(--warn)}
.notice{background:var(--warn-soft);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:20px;width:max-content;max-width:100%}
nav.tabs button{font:inherit;font-weight:500;border:0;background:transparent;color:var(--muted);padding:8px 16px;border-radius:9px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
nav.tabs button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,.offer:focus-within,.aud label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.panel + .panel{margin-top:16px}
.head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.real{font-size:12.5px;color:var(--muted);border-left:2px solid var(--accent);padding-left:10px;margin:0 0 18px;max-width:72ch}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}.grid3{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
/* client "site" frame */
.siteframe{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.urlbar{display:flex;align-items:center;gap:8px;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 14px;font-size:12px;color:var(--muted)}
.urlbar span{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitehead{padding:14px 22px;background:var(--brand);color:#F2F5F1;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.brand img{height:74px;width:auto;display:block}
.wordmark{font-family:var(--display);font-size:20px;font-weight:400;line-height:1.2}
.wordmark em{display:block;font-size:12px;font-weight:300;font-style:italic;color:var(--sage);margin-top:2px}
.sitenav{display:flex;gap:18px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#C3CFC0;flex-wrap:wrap}
.sitenav b{color:var(--sage);font-weight:600}
.sitebody{padding:22px}
.aud{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:10px 0 16px}
.aud label{padding:8px 14px;cursor:pointer;font-size:14px;color:var(--muted)}
.aud label.on{background:var(--accent);color:var(--accent-ink)}
.aud input{position:absolute;opacity:0;pointer-events:none}
.offers{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-bottom:20px}
.offer{position:relative;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--bg);display:grid;gap:4px;align-content:start}
.offer input{position:absolute;opacity:0;inset:0;cursor:pointer}
.offer b{font-weight:600}
.offer .d{font-size:13px;color:var(--muted)}
.offer .pr{font-size:13px;margin-top:4px;display:grid;gap:1px}
.offer .pr span{display:flex;gap:8px;justify-content:space-between}
.offer .pr i{font-style:normal;color:var(--muted)}
.offer.on{border-color:var(--accent);background:var(--accent-soft)}
.forms{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;position:relative;z-index:1}
.fm{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;padding:5px 10px;cursor:pointer}
.fm.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fm.one{cursor:inherit;background:transparent;border-color:transparent;padding-left:0;font-weight:600}
form.f{display:grid;gap:14px;max-width:560px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:460px){.row2{grid-template-columns:1fr}}
label.l{display:grid;gap:5px;font-size:13px;color:var(--muted)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
.total{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}
.total b{font-family:var(--display);font-size:28px;font-weight:500}
.btn{font:inherit;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;border:1px solid transparent;border-radius:3px;padding:10px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:6px 12px;font-size:11.5px}
.btn.crit{background:transparent;color:var(--crit);border-color:var(--crit)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* phone */
.phone{border:1px solid var(--line);border-radius:26px;background:var(--bg);padding:14px 12px 16px;max-width:340px;width:100%}
.phone .ph{font-size:12px;color:var(--muted);text-align:center;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:10px}
.msgs{display:flex;flex-direction:column;gap:8px;min-height:120px}
.b{max-width:88%;padding:9px 12px;font-size:13.5px;border-radius:16px 16px 16px 4px;background:var(--accent-soft);overflow-wrap:anywhere}
.b.out{align-self:flex-end;border-radius:16px 16px 4px 16px;background:var(--accent);color:var(--accent-ink)}
.b small{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}
.b.out small{color:inherit;opacity:.8}
.b .btn{margin-top:6px}
.reply{display:flex;gap:8px;margin-top:12px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;font-size:14px}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.steps li.done .dot{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}
.steps li.now .dot{border-color:var(--warn);color:var(--warn)}
.steps small{display:block;color:var(--muted)}
/* lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .main{min-width:0}
.list .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
@media (max-width:560px){.list li{grid-template-columns:minmax(0,1fr)}.list .acts{justify-content:flex-start}}
.when{font-variant-numeric:tabular-nums;font-weight:600;min-width:7.5ch}
.chip{display:inline-block;font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 7px}
.chip.spa{background:var(--accent-soft);color:var(--accent)}
.chip.massage,.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.wait{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.off{background:var(--bg);color:var(--muted)}
.empty{padding:20px 4px;color:var(--muted)} .empty b{display:block;color:var(--ink);margin-bottom:2px}
.day{font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 2px}
.day:first-child{margin-top:0} .day::first-letter{text-transform:uppercase}
/* accueil cards */
.card{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px 18px;display:grid;gap:2px;align-content:start}
.card .v{font-family:var(--display);font-size:46px;line-height:1;font-weight:500}
.card .k{font-weight:600}
.card .s{font-size:13px;color:var(--muted)}
.card.c-ok .v{color:var(--ok)} .card.c-wait .v{color:var(--warn)} .card.c-crit .v{color:var(--crit)}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:14px}
.bar label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.bar select,.bar input{width:auto}
.strip{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;margin-bottom:16px}
.strip>div{flex:1 1 150px;padding:12px 18px;border-left:1px solid var(--line)}
.strip>div:first-child{border-left:0}
.strip .v{font-family:var(--display);font-size:28px;line-height:1.1;font-weight:500}
.strip .k{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;text-align:left;color:var(--muted);font-weight:600;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
th.r,td.r{text-align:right;padding-right:0}
.tw{overflow-x:auto}
tfoot td{font-weight:600;border-bottom:0}
.log{list-style:none;margin:0;padding:0;font-size:13px}
.log li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.log li:first-child{border-top:0}
.log time{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.people{display:flex;gap:6px;flex-wrap:wrap}
.people button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 14px;cursor:pointer}
.people button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.invoice{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:18px;font-size:14px}
.invoice .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:12px 0}
@media (max-width:560px){.invoice .two{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:min(92vw,420px);z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.foot{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;color:var(--muted);font-size:12.5px}
@media (prefers-reduced-motion:no-preference){.toast{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translate(-50%,6px)}}}
/* ---- dispo ---- */
.sl{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin:12px 0}
.sl button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:9px 8px;cursor:pointer;display:grid;gap:2px;text-align:left;min-height:52px}
.sl button small{font-size:11px;color:var(--muted)}
.sl button.closed{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}.sl button.closed small{color:var(--crit)}
.sl button.pending{background:var(--warn-soft);border-color:var(--warn);cursor:not-allowed}
.sl button.confirmed{background:var(--ok-soft);border-color:var(--ok);cursor:not-allowed}
.sl button.locked{opacity:.7;cursor:not-allowed}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;border:1px solid var(--line);vertical-align:-1px}
.frow{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.frow label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
/* ---- client page ---- */
@media (max-width:700px){.btn{min-height:46px;padding-left:20px;padding-right:20px}nav.tabs button{padding:10px 14px}}
.yn{display:flex;gap:8px;margin-top:8px}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.cl-bar{display:none}
@media (max-width:920px){
 .cl-bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;gap:12px;align-items:center;justify-content:space-between;background:var(--brand);color:#fff;padding:10px 16px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.25)}
 .cl-bar[hidden]{display:none}
 .cl-bar div{min-width:0}.cl-bar small{display:block;font-size:11.5px;color:#C9D5C5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .cl-bar b{font-weight:300;font-size:22px}
 .cl-bar button{flex:none;background:#fff;color:#1f2a2c;border:0;text-transform:uppercase;letter-spacing:.12em;font:500 12px var(--sans);padding:14px 20px;min-height:44px;cursor:pointer}
 .cl .fm{min-height:40px;padding:8px 12px;font-size:13px}
 .cl input,.cl select{font-size:16px;min-height:46px}
 .cl-aud label{padding:18px 8px}
 .cl-nav img{height:54px}
 .cl-body{padding-bottom:90px}
}
.cl [hidden]{display:none!important}
.cl{border-radius:4px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.cl-hero{position:relative;color:#fff;background:#243438 center/cover no-repeat;min-height:440px;display:flex;flex-direction:column;justify-content:space-between}
.cl-hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(22,34,36,.88) 0%,rgba(22,34,36,.58) 50%,rgba(22,34,36,.12) 100%)}
.cl-hero>*{position:relative}
.cl-nav{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;justify-content:space-between;padding:24px 32px}
.cl-nav img{height:66px;width:auto;display:block}
.cl-links{display:flex;gap:24px;flex-wrap:wrap;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.82)}
.cl-links b{color:var(--sage);font-weight:500}
.cl-copy{padding:28px 32px 48px;max-width:680px}
.cl-kicker{font-size:13px;letter-spacing:.03em;color:rgba(255,255,255,.9)}
.cl-hero h2{font-family:var(--display);font-weight:300;font-size:clamp(27px,4.3vw,44px);line-height:1.18;margin:16px 0;color:#fff}
.cl-hero p{font-size:15px;line-height:1.75;color:rgba(255,255,255,.9);max-width:50ch}
.cl-cta{margin-top:26px;background:#fff;color:#1f2a2c;text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:500;padding:15px 30px;border:0;border-radius:0;cursor:pointer;font-family:inherit}
.cl-cta:focus-visible{outline:2px solid #fff;outline-offset:3px}
.cl-body{padding:38px 32px 44px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:920px){.cl-body{grid-template-columns:minmax(0,1fr);padding:28px 18px 32px;gap:28px}.cl-nav,.cl-copy{padding-left:18px;padding-right:18px}.cl-hero{min-height:400px}}
.cl-step{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;display:flex;align-items:center;gap:12px}
.cl-step::after{content:"";flex:1;height:1px;background:var(--line)}
.cl-aud{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);margin-bottom:34px}
.cl-aud label{padding:15px 12px;text-align:center;cursor:pointer;font-size:14px;color:var(--ink);position:relative}
.cl-aud label + label{border-left:1px solid var(--line)}
.cl-aud label.on{background:var(--accent);color:var(--accent-ink)}
.cl-aud input{position:absolute;opacity:0;pointer-events:none}
.cl-aud label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.cl-g{margin-bottom:30px}
.cl-grp{position:relative;height:96px;background:#243438 center/cover no-repeat;color:#fff;display:flex;align-items:flex-end;padding:14px 18px;margin-bottom:12px}
.cl-grp::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(18,28,30,.82),rgba(18,28,30,.18))}
.cl-grp span{position:relative;font-weight:300;font-size:21px}
.cl-g .offers{margin-bottom:0;grid-template-columns:repeat(auto-fill,minmax(235px,1fr))}
.cl .offer{background:var(--surface);border-radius:2px;padding:16px 16px 14px}
.cl .offer:hover{border-color:var(--sage)}
.cl .offer b{font-weight:500;font-size:15px;padding-right:20px}
.cl .offer .d{font-size:12.5px;line-height:1.6}
.cl .offer.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.cl .offer.on::after{content:"\2713";position:absolute;top:12px;right:14px;color:var(--accent);font-size:14px}
.dur{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cl .fm{border-radius:2px}
.cl-book{background:var(--brand);color:#EEF2EC;padding:28px 26px 26px;border-radius:2px}
.cl-book h3{color:var(--sage);letter-spacing:.18em;margin-bottom:18px}
.cl-book label.l{color:#B9C6B5}
.cl-book input,.cl-book select{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:2px}
.cl-book input::placeholder{color:rgba(255,255,255,.4)}
.cl-book input[type=date]{color-scheme:dark}
.cl-book select option{color:#1f2a2c;background:#fff}
.cl-book input:focus-visible,.cl-book select:focus-visible{outline:2px solid var(--sage)}
.cl-book #f-sum{color:#C9D5C5;font-size:12.5px;line-height:1.5}
.cl-book .total{border-top:1px solid rgba(255,255,255,.2)}
.cl-book .total b{color:#fff;font-weight:300;font-size:38px}

function live(){return reqs.filter(function(r){return r.status!=='annule';});}
function byWhen(a,b){return (a.date+a.time).localeCompare(b.date+b.time);}
function pending(){return live().filter(function(r){return r.status==='attente';}).sort(byWhen);}
function confirmed(){return live().filter(function(r){return r.status==='confirme';}).sort(byWhen);}
function isPast(r){return new Date(r.date+'T'+r.time+':00').getTime()+r.dur*60000<Date.now();}
function waitMin(r){return (Date.now()-r.createdAt)/60000;}
function allDeclined(r){return r.status==='attente'&&(r.declined||[]).length+(r.practitioners||[]).length>=PRACT.length;}
function toRelance(){return pending().filter(function(r){return waitMin(r)>=cfg.relanceMin||allDeclined(r);});}
function inValidation(){return pending().filter(function(r){return waitMin(r)<cfg.relanceMin&&!allDeclined(r);});}

  var s={}; reqs.forEach(function(r){s[r.date.slice(0,7)]=1;});
  return Object.keys(s).sort().reverse();
}
function inPeriod(r){return !period||period==='tout'||r.date.slice(0,7)===period;}
function initPeriods(){

  var all=live().sort(byWhen), byDay={}, days=[];
  all.forEach(function(r){ if(!byDay[r.date]){byDay[r.date]=[];days.push(r.date);} byDay[r.date].push(r); });

  var plan=h('div',{class:'panel'},
    h('div',{class:'head'},h('h2',null,'Planning à venir'),h('span',{class:'small muted'},upDays.reduce(function(s,d){return s+byDay[d].length;},0)+' créneaux')),
    upDays.length?upDays.map(function(d){

            h('div',{class:'acts'},h('span',{class:'chip '+(wait?'wait':'ok')},wait?'En attente':'Confirmé'),

  var logs=[]; reqs.forEach(function(r){(r.log||[]).forEach(function(l){logs.push({t:l.t,msg:logText(r,l),who:r.name});});});

  root.append(h('div',{class:'grid2'},h('div',{class:'stack'},todo,plan),h('div',{class:'stack'},jour)),
    h('div',{class:'foot'},h('span',null,'Clients et réservations d’exemple, fictifs.'),

}
function remind(r){
  var t=Date.now();
  store.update(r.id,{remindedAt:t,log:(r.log||[]).concat([{t:t,k:'remind'}])}).then(function(){toast('Relance envoyée aux praticiennes.');}).catch(writeErr);
}
function age(r){store.update(r.id,{createdAt:r.createdAt-3600000}).catch(writeErr);}
function cancel(r){
  var t=Date.now();
  store.update(r.id,{status:'annule',log:(r.log||[]).concat([{t:t,k:'cancel'}])}).then(function(){toast('Créneau annulé, le client est prévenu par SMS.');}).catch(writeErr);
}
function resetDemo(){
  if(!resetArmed){resetArmed=true;renderAccueil();setTimeout(function(){resetArmed=false;if(view==='accueil')renderAccueil();},4000);return;}
  resetArmed=false;
  reqs.map(function(r){return r.id;}).reduce(function(p,id){return p.then(function(){return store.remove(id);});},Promise.resolve())
    .then(function(){lastId=null;toast('Données de démo effacées.');}).catch(writeErr);
}

/* ---------- compta ---------- */
function renderCompta(){
  var act=document.activeElement; if(act&&act.closest&&act.closest('#v-compta')&&(act.tagName==='INPUT')) return;
  var root=$('#v-compta'); root.replaceChildren();
  var ms=months(); if(ms.indexOf(comptaMonth)<0) ms.unshift(comptaMonth);
  var bar=h('div',{class:'bar'},
    h('label',null,'Mois',h('select',{id:'c-month',onchange:function(e){comptaMonth=e.target.value;renderCompta();}},ms.map(function(k){return h('option',{value:k,selected:k===comptaMonth},monthLabel(k));}))),
    h('label',null,'Reversé par heure de massage',h('input',{id:'share-in',type:'number',min:'0',max:'500',value:cfg.rate,style:'width:80px',onchange:function(e){setShare(e.target.value);}}),'€'));

    var amt=L.reduce(function(s,r){return s+lineAmt(r);},0);
    return {p:p,n:L.length,up:up.length,amt:amt};
  });
  var tb=h('tbody'); var tn=0,ta=0;
  sumRows.forEach(function(s){tn+=s.n;ta+=s.amt;
    tb.append(h('tr',null,h('td',null,s.p),h('td',{class:'r num'},s.n),h('td',{class:'r num'},s.up),h('td',{class:'r num'},eur(s.amt))));});
  var summary=h('div',{class:'panel'},
    h('div',{class:'head'},h('h2',null,'Décompte de '+monthLabel(comptaMonth)),h('span',{class:'small muted'},'Massages réalisés uniquement')),
    h('div',{class:'tw'},h('table',null,h('thead',null,h('tr',null,h('th',null,'Praticienne'),h('th',{class:'r'},'Massages réalisés'),h('th',{class:'r'},'À venir'),h('th',{class:'r'},'À verser'))),tb,
      h('tfoot',null,h('tr',null,h('td',null,'Total'),h('td',{class:'r num'},tn),h('td',{class:'r'}),h('td',{class:'r num'},eur(ta)))))),
    h('p',{class:'small muted',style:'margin-top:12px'},'Chaque praticienne reçoit 50 € par heure de massage facturée 110 € au client. Rien n’est reversé sur le spa. Le massage inclus dans « Entre de bonnes mains » est compté pour 1 h ; celui du rituel de relaxation (30 min) pour 25 €, hypothèse à confirmer.'));

  var ppl=h('div',{class:'people',role:'group','aria-label':'Praticienne',style:'margin:16px 0'},
    PRACT.map(function(p){return h('button',{type:'button','aria-pressed':p===comptaWho?'true':'false',onclick:function(){comptaWho=p;renderCompta();}},p);}));
  var idx=PRACT.indexOf(comptaWho), info=pros[idx]||{};
  var L=proLines(comptaWho,comptaMonth).filter(isPast), up=proLines(comptaWho,comptaMonth).filter(function(r){return !isPast(r);});
  var total=L.reduce(function(s,r){return s+lineAmt(r);},0);
  var no=comptaMonth.replace('-','')+'-'+comptaWho.slice(0,3).toUpperCase();
  var lines=h('tbody',null,L.length?L.map(function(r){
    return h('tr',null,h('td',null,dayShort(r.date)+' '+r.time),h('td',null,r.offerTitle+' · '+r.firstName+' '+r.lastName.charAt(0)+'.'),h('td',{class:'r num'},String(massageH(r)).replace('.',',')+' h'),h('td',{class:'r num'},eur(lineAmt(r))));
  }):h('tr',null,h('td',{colspan:'4',class:'muted'},'Aucun massage réalisé ce mois-ci.')));
  var inv=h('div',{class:'invoice'},
    h('h2',null,'Facture '+no),
    h('p',{class:'small muted'},'Émise le '+dayLong(todayStr(0))+' · Prestations de massage, '+monthLabel(comptaMonth)),
    h('div',{class:'two'},
      h('div',null,h('h3',null,'Praticienne'),h('div',null,comptaWho),h('div',{class:'small muted'},info.siret?'SIRET '+info.siret:'SIRET à renseigner'),h('div',{class:'small muted'},info.adresse||'Adresse à renseigner')),
      h('div',null,h('h3',null,'Facturé à'),h('div',null,'Couvent de la Salette & Spa'),h('div',{class:'small muted'},'387 avenue de l’Aigoual, 12100 Millau'))),
    h('div',{class:'tw'},h('table',null,h('thead',null,h('tr',null,h('th',null,'Date'),h('th',null,'Prestation'),h('th',{class:'r'},'Durée'),h('th',{class:'r'},'Montant'))),lines,
      h('tfoot',null,h('tr',null,h('td',{colspan:'3'},'Total à régler'),h('td',{class:'r num'},eur(total)))))),
    h('p',{class:'small muted',style:'margin-top:10px'},'Mention de TVA à confirmer selon le régime de la praticienne (par exemple « TVA non applicable, art. 293 B du CGI »). Règlement mensuel, échéance à fixer.'),
    up.length?h('p',{class:'small muted'},up.length+' massage'+(up.length>1?'s':'')+' à venir ce mois-ci, non facturé'+(up.length>1?'s':'')+' à ce jour.'):null);
  var fields=h('div',{class:'row2',style:'max-width:560px;margin:14px 0 6px'},
    h('label',{class:'l'},'SIRET de '+comptaWho,h('input',{id:'p-siret',value:info.siret||'',placeholder:'14 chiffres',onchange:function(e){savePro(idx,{siret:e.target.value.trim()});}})),
    h('label',{class:'l'},'Adresse',h('input',{id:'p-adr',value:info.adresse||'',placeholder:'Rue, code postal, ville',onchange:function(e){savePro(idx,{adresse:e.target.value.trim()});}})));
  var acts=h('div',{style:'display:flex;gap:8px;flex-wrap:wrap;margin-top:14px'},
    h('button',{class:'btn',type:'button',disabled:!dl||!L.length,onclick:function(){downloadInvoice(no,info,L,total);}},'Télécharger la facture'),
    h('button',{class:'btn ghost',type:'button',disabled:!dl||!L.length,onclick:function(){downloadCsv(no,L,total);}},'Télécharger le décompte (CSV)'),
    dl?null:h('span',{class:'small muted'},'Téléchargement indisponible dans cette vue.'));
  root.append(bar,summary,h('div',{class:'panel'},h('div',{class:'head'},h('h2',null,'Facture mensuelle'),h('span',{class:'small muted'},'Une par praticienne et par mois')),ppl,inv,fields,acts));
}
function setShare(v){
  var n=Math.max(0,Math.min(500,Math.round(+v))); if(isNaN(n)) return;
  store.setCfg({rate:n}).then(function(){cfg.rate=n;renderActive();}).catch(writeErr);
}
function savePro(i,v){store.setPro(i,v).then(function(){pros[i]=Object.assign({},pros[i],v);renderCompta();}).catch(writeErr);}
function saveFile(name,data){
  if(!dl){
    try{ var ty=/\.csv$/.test(name)?'text/csv':'text/html', bl=new Blob([data],{type:ty+';charset=utf-8'}), u=URL.createObjectURL(bl), a=document.createElement('a');
      a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},2000);toast('Fichier téléchargé.');}
    catch(e){toast('Téléchargement impossible ici.');}
    return;
  }
  dl.save({filename:name,data:data}).then(function(){toast('Fichier enregistré.');}).catch(function(e){if(!e||e.code!=='declined') toast('Téléchargement impossible ici.');});
}
function downloadCsv(no,L,total){
  var rows=[['Date','Heure','Client','Prestation','Prix client (€)','Durée massage (h)','Montant praticienne (€)']];
  L.forEach(function(r){rows.push([r.date,r.time,r.name,r.offerTitle,r.price,massageH(r),lineAmt(r)]);});
  rows.push(['','','','Total','','',total]);
  saveFile('decompte-'+no+'.csv','﻿'+rows.map(function(x){return x.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(';');}).join('\n'));
}
function downloadInvoice(no,info,L,total){
  var rows=L.map(function(r){return '<tr><td>'+esc(dayShort(r.date)+' '+r.time)+'</td><td>'+esc(r.offerTitle+' · '+r.name)+'</td><td style="text-align:right">'+esc(eur(lineAmt(r)))+'</td></tr>';}).join('');
  var html='<!doctype html><html lang="fr"><meta charset="utf-8"><title>Facture '+esc(no)+'</title><style>body{font:15px/1.5 system-ui,sans-serif;max-width:720px;margin:32px auto;padding:0 16px;color:#1B2730}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ccc;padding:8px 4px;text-align:left}h1{font-size:24px}.t{text-align:right;font-weight:600}</style>'
   +'<h1>Facture '+esc(no)+'</h1><p>Émise le '+esc(dayLong(todayStr(0)))+'</p>'
   +'<p><b>'+esc(comptaWho)+'</b><br>'+esc(info.siret?'SIRET '+info.siret:'SIRET à renseigner')+'<br>'+esc(info.adresse||'Adresse à renseigner')+'</p>'
   +'<p><b>Facturé à</b><br>Couvent de la Salette &amp; Spa<br>387 avenue de l’Aigoual, 12100 Millau</p>'
   +'<table><tr><th>Date</th><th>Prestation</th><th style="text-align:right">Montant</th></tr>'+rows+'<tr><td colspan="2" class="t">Total à régler</td><td class="t">'+esc(eur(total))+'</td></tr></table>'
   +'<p style="font-size:13px;color:#555">Mention de TVA à confirmer selon le régime de la praticienne. Document généré par une démonstration.</p></html>';
  saveFile('facture-'+no+'.html',html);
}

/* ---------- boot ---------- */
function onData(arr){reqs=arr;renderActive();}
function start(s,m){
  store=s; mode=m; renderPills();
  s.watch(onData);
  s.watchCfg(function(c){cfg=c;renderActive();});
  s.watchPros(function(p){pros=p;if(view==='compta')renderCompta();});
}
document.querySelectorAll('nav.tabs button').forEach(function(b){b.addEventListener('click',function(){setView(b.dataset.v);});});
window.addEventListener('hashchange',function(){var v=location.hash.slice(1);if(VIEWS.indexOf(v)>-1&&v!==view) setView(v);});
var saved=lsGet('flux-who'); if(saved&&PRACT.indexOf(saved)>-1) who=saved;
buildClient();
start(localStore(),'loading');
setView(VIEWS.indexOf(location.hash.slice(1))>-1?location.hash.slice(1):'accueil');
setInterval(function(){if(view!=='client'&&document.activeElement&&document.activeElement.tagName!=='INPUT') renderActive();},60000);

if(window.claude&&window.claude.use){
  window.claude.use('downloads').then(function(d){dl=d;if(view==='compta')renderCompta();}).catch(function(){});
  window.claude.use('db').then(function(db){
    if(!db){mode='local';renderPills();return;}
    reqs=[]; start(dbStore(db),'db'); renderActive();
    return window.claude.use('user').then(function(u){
      if(u&&u.can){return Promise.resolve(u.can('data.write')).then(function(ok){
        if(ok===false){canWrite=false;$('#notice').textContent='Vous êtes en lecture seule : vous voyez la démo mais ne pouvez pas la modifier.';}
      });}
    });
  }).catch(function(){mode='local';renderPills();});
} else { mode='local'; renderPills(); }
})();
